name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
      - mkdocs.yml
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - LICENSE
      - mkdocs.yml

permissions:
  contents: read

jobs:
  unicode:
    uses: ./.github/workflows/_unicode-lint.yaml

  go:
    uses: ./.github/workflows/_go.yaml

  build:
    runs-on: ubuntu-latest
    needs: [go]
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags="-s -w" -o bin/openvox-code-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/openvox-code

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: openvox-code-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/

  container:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build container image
        run: docker build -f Containerfile -t openvox-code:ci .

      - name: Verify container runs
        run: docker run --rm openvox-code:ci version

  goreleaser:
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: GoReleaser check
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: check
