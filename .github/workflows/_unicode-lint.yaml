name: Unicode Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unicode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject suspicious Unicode
        run: ./hack/unicode-lint.sh
