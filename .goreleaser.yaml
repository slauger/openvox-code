version: 2

project_name: openvox-code

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/openvox-code
    binary: openvox-code
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
      - -X main.date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# The GitHub release and its notes are created by semantic-release,
# GoReleaser only attaches the build artifacts and pushes the image.
release:
  mode: keep-existing

changelog:
  disable: true

dockers_v2:
  - images:
      - ghcr.io/slauger/openvox-code
    tags:
      - "{{ .Version }}"
      - latest
    dockerfile: Containerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
